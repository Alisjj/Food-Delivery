services:
    web:
        build: ./app
        command: python manage.py runserver 0.0.0.0:8000
        volumes:
            - ./app/:/usr/src/app/
        ports:
            - 8000:8000
        env_file:
            - ./app/.env.dev

    redis:
        image: redis:alpine
        deploy:
            resources:
                limits:
                    cpus: 2
                    memory: 512M
                reservations:
                    cpus: 1
                    memory: 256M

    celery:
        build: ./app
        command: celery -A config worker -l info
        volumes:
            - ./app/:/usr/src/app/
        env_file:
            - ./app/.env.dev
        depends_on:
            - web
            - redis

    celery-beat:
        build: ./app
        command: celery -A config beat -l info
        volumes:
            - ./app/:/usr/src/app/
        env_file:
            - ./app/.env.dev
        depends_on:
            - redis
